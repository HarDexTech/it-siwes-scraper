name: collect

# Web search, job sites, Telegram, Indeed and Nairaland every 6 hours.
# X is NOT collected here - it runs on the owner's PC via scripts/run_x.py.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install browser for StealthyFetcher
        if: ${{ vars.STEALTHY_FETCH == '1' }}
        run: scrapling install
      - name: Tests
        run: pytest -q
      - name: Collect
        run: python scripts/run_collect.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          STEALTHY_FETCH: ${{ vars.STEALTHY_FETCH }}
