services:
  - type: web
    name: siwes-placement-finder
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false          # paste the siwes_web role's pooled connection string
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CONTACT_EMAIL
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
